name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Vitest
        run: npm test

  e2e-smoke:
    name: E2E smoke (público)
    runs-on: ubuntu-latest
    needs: test
    env:
      E2E_BASE_URL: https://www.recrutaindustria.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke público
        run: npm run test:e2e:smoke

  e2e-empresa:
    name: E2E empresa logada
    runs-on: ubuntu-latest
    needs: test
    # Secrets: E2E_COMPANY_EMAIL + E2E_COMPANY_PASSWORD (docs/e2e-secrets.md).
    # Sem secrets: Playwright faz skip. Com secrets e login inválido: job falha e o CI fica vermelho.
    env:
      E2E_BASE_URL: https://www.recrutaindustria.com
      E2E_COMPANY_EMAIL: ${{ secrets.E2E_COMPANY_EMAIL }}
      E2E_COMPANY_PASSWORD: ${{ secrets.E2E_COMPANY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Funil empresa logada
        run: npx playwright test e2e/empresa-logada.spec.ts e2e/empresa-perfil-vitrine.spec.ts

  e2e-profissional:
    name: E2E profissional logado
    runs-on: ubuntu-latest
    needs: test
    # Secrets: E2E_PROFESSIONAL_EMAIL + E2E_PROFESSIONAL_PASSWORD (docs/e2e-secrets.md).
    # Sem secrets: Playwright faz skip. Com secrets e login inválido: job falha e o CI fica vermelho.
    env:
      E2E_BASE_URL: https://www.recrutaindustria.com
      E2E_PROFESSIONAL_EMAIL: ${{ secrets.E2E_PROFESSIONAL_EMAIL }}
      E2E_PROFESSIONAL_PASSWORD: ${{ secrets.E2E_PROFESSIONAL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Dashboard profissional logado
        run: npm run test:e2e:profissional

  build:
    name: Build e typecheck
    runs-on: ubuntu-latest
    needs: test

    env:
      NEXTAUTH_SECRET: ci-build-secret-with-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build de produção
        run: npm run build
